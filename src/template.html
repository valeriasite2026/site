<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
%%HEAD%%
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE8DF; --paper:#F5F2EA; --ink:#1F1E1B; --olive:#6B6B4A; --olive-d:#5A5A3D;
  --ph:#D5D1C5; --line:#DDD8CC; --muted:#4A4943; --soft:#D5D1C5; --dim:#B8B4A8; --rule:#4A4943;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,p,dl,dd,ol{margin:0}
.wrap{padding:20px;display:flex;flex-direction:column;gap:20px}
.card{border-radius:16px;border:1px solid var(--line);background-color:var(--paper);
  background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),rgba(31,30,27,.06) calc(25% - 1px),rgba(31,30,27,.06) 25%)}
.dark{border-radius:16px;background:var(--ink);color:var(--paper)}
.sec{padding:110px 5.4% 120px}
.sec+.sec{border-top:1px solid var(--line)}
.oswald{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:14px}
.logo .rule{margin-left:12px}
.logo-in{display:flex;align-items:center;gap:12px}
.lm{width:42px;height:42px;flex:none;display:block}
.lw{display:flex;flex-direction:column;line-height:1;text-align:left}
.lw b{font-family:'Oswald',sans-serif;font-weight:600;font-size:19px;letter-spacing:.34em}
.lw i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.52em;margin-top:6px;opacity:.75}
.rule{display:block;width:72px;height:1px;background:currentColor}
.nav{display:flex;gap:40px;font-size:13px;letter-spacing:.12em}
.nav a:hover,.tlink:hover{color:var(--olive)}
.dark .tlink:hover{color:var(--soft)}
.nav a.on{font-weight:500;border-bottom:1px solid;padding-bottom:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:54px;padding:0 40px;border-radius:999px;border:1px solid var(--olive);background:var(--olive);color:var(--paper);font-size:13px;letter-spacing:.18em;transition:background .2s,border-color .2s;white-space:nowrap}
.btn:hover{background:var(--olive-d);border-color:var(--olive-d)}
.btn.lg{min-height:64px;padding:0 44px;letter-spacing:.2em}
.btn.light{background:var(--paper);border-color:var(--paper);color:var(--ink)}
.btn.light:hover{background:#E4E0D6;border-color:#E4E0D6}
.btn.wide{justify-content:space-between;padding:0 28px;min-height:60px}
.tlink{display:inline-flex;align-items:center;gap:16px;font-size:13px;letter-spacing:.2em;min-height:44px}

/* typography */
.label{display:flex;align-items:center;gap:24px;font-size:14px;letter-spacing:.3em}
.h2{margin-top:28px;font-size:92px;line-height:.95}
.lead{font-size:15px;line-height:1.8}

/* placeholders */
.pic{position:relative;overflow:hidden;background:var(--ph);display:block}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.ph{border-radius:8px;background:var(--ph);display:flex;align-items:center;justify-content:center}
.ph svg{width:60px;height:45px}
.ph.big svg{width:100px;height:75px}

/* hero */
.hero{min-height:860px;padding:26px 5.4% 48px;display:flex;flex-direction:column;position:relative}
.hero-body{flex:1;display:flex;flex-wrap:wrap;gap:9%;margin-top:46px;padding-right:2.5%}
.hero-left{flex:0 1 490px;min-width:0;max-width:490px;display:flex;flex-direction:column}
.hero-name{margin-top:26px;font-size:132px;line-height:.92;letter-spacing:-.01em}
.hero-photo{flex:2 1 520px;min-width:0;min-height:700px;border-radius:10px}
.video{position:relative;margin-top:14px;height:166px;border-radius:6px;transition:filter .2s,transform .2s}
.video:hover{filter:brightness(.95);transform:translateY(-2px)}
.play{position:absolute;right:22px;bottom:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center}
.circle{width:50px;height:50px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.vert{position:absolute;right:1.6%;top:150px;bottom:120px;display:flex;flex-direction:column;align-items:center;gap:18px}
.vert .ln{width:1px;flex:1;background:var(--ink)}
.vert span.t{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;letter-spacing:.3em}

/* about */
.about{display:flex;flex-wrap:wrap;gap:6%;align-items:stretch}
.about-photos{flex:1 1 380px;min-width:0;position:relative;display:flex;flex-direction:column;padding-bottom:40px}
.about-main{flex:1;min-height:640px;border-radius:10px}
.about-small{position:absolute;right:-28px;bottom:0;width:46%;height:240px;border:10px solid var(--paper);border-radius:8px;background:#CBC6B9}
.about-text{flex:1.2 1 440px;min-width:0;padding-top:20px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:56px}
.fact{border-top:1px solid var(--ink);padding-top:16px}
.fact b{display:block;font-family:'Oswald',sans-serif;font-size:48px;line-height:1}
.facts.path{margin-top:44px}
.facts.path b{color:var(--olive);font-size:40px}
.fact span{display:block;margin-top:10px;font-size:12px;letter-spacing:.18em;line-height:1.6}

/* previews */
.previews{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:64px}
.mini{height:360px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}
.mini .zoom{border-radius:5px}
.zoom{border:none;padding:0;margin:0;cursor:zoom-in;font:inherit;transition:filter .2s,transform .2s}
.zoom:hover{filter:brightness(1.06);transform:scale(1.01)}
.zoom:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(20,19,17,.94);display:flex;align-items:center;justify-content:center;padding:64px 88px;animation:lbIn .2s ease both}
.lb[hidden]{display:none}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lb-fig{margin:0;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:100%;max-height:100%}
.lb-stage{display:flex;align-items:center;justify-content:center;max-width:100%;animation:lbZoom .25s ease both}
@keyframes lbZoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.lb-stage img{display:block;max-width:calc(100vw - 176px);max-height:calc(100vh - 160px);border-radius:6px;object-fit:contain}
.lb-ph{border-radius:6px;display:flex;align-items:center;justify-content:center}
.lb-ph svg{width:96px;height:72px}
.lb-cap{color:var(--paper);font-size:12px;letter-spacing:.22em;text-transform:uppercase;text-align:center}
.lb-btn{position:absolute;width:56px;height:56px;border-radius:50%;border:1px solid rgba(245,242,234,.5);background:transparent;color:var(--paper);font-size:20px;display:flex;align-items:center;justify-content:center}
.lb-btn:hover{background:var(--olive);border-color:var(--olive)}
.lb-close{top:20px;right:20px;font-size:26px}
.lb-prev{left:20px;top:50%;transform:translateY(-50%)}
.lb-next{right:20px;top:50%;transform:translateY(-50%)}
@media (max-width:900px){
  .lb{padding:72px 12px 96px}
  .lb-stage img{max-width:calc(100vw - 24px);max-height:calc(100vh - 190px)}
  .lb-prev,.lb-next{top:auto;bottom:24px;transform:none}
  .lb-prev{left:calc(50% - 68px)}.lb-next{right:calc(50% - 68px)}
  .lb-close{top:14px;right:14px}
}
.badge{display:inline-flex;align-items:center;align-self:flex-start;min-height:30px;padding:0 14px;border-radius:999px;border:1px solid currentColor;font-size:11px;letter-spacing:.22em}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);font-size:11px;letter-spacing:.16em;color:var(--dim)}

/* steps */
.steps{list-style:none;padding:0;margin-top:64px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px}
.steps li{border-top:1px solid var(--ink);padding-top:22px}
.steps .n{font-family:'Oswald',sans-serif;font-weight:700;font-size:64px;line-height:1;color:var(--olive)}
.steps .t{margin-top:22px;font-size:14px;letter-spacing:.18em;font-weight:500}
.steps p{margin-top:12px;font-size:14px;line-height:1.7}

/* booking */
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:24px;align-items:stretch}
.svc{display:flex;flex-direction:column;text-align:left;width:100%;padding:28px 28px 30px;border-radius:12px;color:var(--ink);background:transparent;border:1px solid #CFCABE;transition:border-color .2s,background .2s}
.svc:hover{border-color:var(--olive)}
.svc.on{background:var(--olive);border:1px solid var(--olive);color:var(--paper)}
.svc .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.2em}
.svc .dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--ink)}
.svc.on .dot{background:var(--olive);border:4px solid var(--paper)}
.svc .nm{margin-top:32px;font-size:38px;line-height:1.12}
.gtabs{display:flex;flex-wrap:wrap;gap:10px;margin-top:48px}
.gnote{margin:18px 0 0;font-size:14px;line-height:1.7;color:var(--muted)}
.gtab{min-height:48px;padding:10px 22px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-size:12px;letter-spacing:.14em;line-height:1.5;text-align:left}
.gtab:hover{border-color:var(--olive);color:var(--olive)}
.gtab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.svc .price{margin-top:10px;font-size:34px;line-height:1}
.svc .price small{font-size:18px;letter-spacing:.04em}
.tlist{list-style:none;margin:24px 0 0;padding:18px 0 0;border-top:1px solid #CFCABE;display:flex;flex-direction:column;gap:9px;font-size:13px;line-height:1.5}
.tlist li{position:relative;padding-left:18px}
.tlist li:before{content:'';position:absolute;left:0;top:.6em;width:8px;height:1px;background:currentColor}
.svc.on .tlist{border-top-color:rgba(245,242,234,.35)}
.tnote{margin:24px 0 0;padding-top:18px;border-top:1px solid #CFCABE;font-size:13px;opacity:.8}
.prepay{margin-top:20px;padding:18px 22px;border:1px dashed var(--olive);border-radius:12px;font-size:13px;line-height:1.7}
.prepay b{font-weight:500;color:var(--olive)}
.svc .tbl{display:flex;flex-direction:column;gap:10px;margin-top:32px;padding-top:18px;border-top:1px solid #CFCABE;font-size:13px;letter-spacing:.1em}
.svc .tbl span{display:flex;justify-content:space-between}
.msgbox{display:flex;flex-wrap:wrap;gap:40px;margin-top:40px;padding:36px;border-radius:14px;background:var(--bg)}
.bubble{margin-top:16px;padding:22px 24px;border-radius:18px 18px 18px 4px;background:var(--paper);border:1px solid var(--line);font-size:15px;line-height:1.7}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mbtn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 20px;border-radius:999px;font-size:13px;letter-spacing:.16em;background:var(--olive);color:var(--paper);border:1px solid var(--olive);transition:background .2s}
.mbtn:hover{background:var(--olive-d)}
.mbtn.on{background:var(--ink);border-color:var(--ink)}
.hint{min-height:48px;font-size:13px;line-height:1.6}

/* portfolio carousel */
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tab{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 26px;border-radius:999px;font-size:13px;letter-spacing:.16em;background:transparent;color:var(--paper);border:1px solid #6E6C63}
.tab:hover{border-color:var(--paper)}
.tab .c{font-size:11px;padding:2px 8px;border-radius:999px;background:#3A3933}
.tab.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tab.on .c{background:var(--ink);color:var(--paper)}
.works{display:flex;flex-wrap:wrap;gap:48px;margin-top:44px}
.info{flex:1 1 300px;max-width:360px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.info h2{margin-top:20px;font-size:58px;line-height:.95;overflow-wrap:normal;word-break:normal}
.info dl{margin-top:28px;display:flex;flex-direction:column;gap:12px;font-size:12px;letter-spacing:.18em}
.info dl div{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--rule);padding-top:12px}
.info dt{color:var(--dim)}
.info dd{text-align:right}
.stage{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.collage{height:620px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:10px}
.collage .ph{border-radius:6px;animation:fade .45s ease both}
.collage .ph svg{width:40px;height:30px}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.prog{flex:1;max-width:420px;height:2px;background:var(--rule);border-radius:2px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--paper);transition:width .35s ease}
.dotb{min-width:44px;height:44px;border-radius:6px;font-size:12px;letter-spacing:.1em;background:transparent;color:var(--dim);border:1px solid var(--rule)}
.dotb:hover{border-color:var(--paper)}
.dotb.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.arrow{width:56px;height:56px;border-radius:50%;font-size:20px;border:1px solid var(--paper);background:transparent;color:var(--paper)}
.arrow.fill{background:var(--paper);color:var(--ink)}
.arrow:hover{background:var(--olive);border-color:var(--olive);color:var(--paper)}

/* footer */
.footer{padding:80px 5.4% 36px;overflow:hidden}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px}
.fh{font-size:12px;letter-spacing:.24em;color:#C9C5B9}
.flist{display:flex;flex-direction:column;gap:12px;margin-top:20px;font-size:14px;letter-spacing:.12em}
.flist a:hover{color:var(--soft)}
.mark{margin-top:80px;font-size:200px;line-height:.85;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.fbottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:32px;padding-top:20px;border-top:1px solid var(--rule);font-size:12px;letter-spacing:.14em;color:#C9C5B9}

.hero-ctas{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-top:50px}
.menu-btn,.mnav,.m-photo{display:none}

.proto-note{display:block;width:fit-content;max-width:calc(100% - 32px);margin:14px auto 0;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:.06em;padding:7px 16px;border-radius:999px;text-align:center}

@media (max-width:1100px){
  .h2{font-size:68px}
  .hero-name{font-size:108px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .wrap{padding:10px;gap:10px}
  .nav,.vert,.logo,.video,.hero-photo{display:none}
  .header{position:relative;flex-wrap:nowrap}
  .header .btn{min-height:44px;padding:0 16px;font-size:12px;letter-spacing:.12em;flex:none}
  .menu-btn{min-width:0}
  .menu-btn{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:0;background:none;border:none;color:inherit}
  .menu-btn .lm{width:36px;height:36px}
  .menu-btn .lw b{font-size:16px}
  .menu-btn svg{transition:transform .25s}
  .header.open .menu-btn svg{transform:rotate(180deg)}
  .header.open .mnav{display:flex;flex-direction:column;position:absolute;top:calc(100% + 12px);left:0;right:0;z-index:20;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 20px;box-shadow:0 12px 32px rgba(31,30,27,.14);animation:drop .2s ease both}
  .mnav a{display:flex;align-items:center;justify-content:space-between;min-height:54px;border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.14em}
  .mnav a:last-child{border-bottom:none}
  .mnav a[aria-current]{font-weight:500;color:var(--olive)}
  .hero-body{margin-top:36px;padding-right:0}
  .m-photo{display:flex;height:460px;margin-top:28px;border-radius:10px}
  .hero-left .tlink{margin-top:24px!important}
  .hero-ctas{flex-direction:column;align-items:stretch;gap:20px;margin-top:20px}
  .hero-ctas .btn{width:100%}
  .proto-note{font-size:10px;letter-spacing:.04em;padding:6px 12px;margin-top:10px}
  .sec{padding:72px 6% 80px}
  .hero{min-height:0;padding:20px 6% 40px}
  .hero-name{font-size:80px}
  .hero-photo{min-height:420px;margin-top:32px}
  .h2{font-size:52px}
  .previews,.steps,.services,.facts,.fgrid{grid-template-columns:minmax(0,1fr)}
  .about-small{right:10px;bottom:-36px;height:190px;width:52%}
  .about-main{flex:none;height:500px;min-height:0}
  .about-photos{padding-bottom:0}
  .facts.path{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px;margin-top:36px}
  .facts.path b{font-size:30px}
  .facts.path .fact span{font-size:10px;letter-spacing:.12em}
  .about-photos{margin-bottom:64px}
  .collage{height:500px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:6px}
  .collage .ph{grid-area:var(--ma)!important}
  .info h2{font-size:52px}
  .mark{font-size:64px}
  .mgrid{grid-template-columns:minmax(0,1fr)}
  .btn{padding:0 26px}
  .btn.lg{padding:0 28px}
}
</style>
</head>
<body>
<div id="app"></div>

<script src="/app.js"></script>
</body>
</html>
