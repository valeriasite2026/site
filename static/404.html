<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — Фотограф Валерія</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F1E1B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECE8DF;--paper:#F5F2EA;--ink:#1F1E1B;--olive:#6B6B4A;--olive-d:#5A5A3D;--muted:#77736A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:15px;line-height:1.7;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1280px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:22px}
.logo{display:flex;align-items:center;gap:14px}
.lm{width:42px;height:42px;flex:none;display:block}
.lw{display:flex;flex-direction:column;line-height:1}
.lw b{font-family:'Oswald',sans-serif;font-weight:600;font-size:19px;letter-spacing:.34em}
.lw i{font-style:normal;font-size:9px;letter-spacing:.52em;margin-top:6px;opacity:.75}
main{flex:1;display:flex;align-items:center}
main .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px;align-items:center;padding-block:40px 72px}
.k{display:flex;align-items:center;gap:16px;font-size:12px;letter-spacing:.24em;color:var(--olive)}
.k::after{content:"";width:64px;height:1px;background:currentColor}
h1{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(52px,7.4vw,104px);line-height:1;margin:22px 0 0;letter-spacing:-.005em;text-wrap:balance}
p{margin:26px 0 0;max-width:440px;color:#4A4943}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:54px;padding:0 34px;border-radius:999px;border:1px solid var(--olive);background:var(--olive);color:var(--paper);font-size:13px;letter-spacing:.18em;transition:background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:hover{background:var(--olive-d);border-color:var(--olive-d)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.frame{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:18px;overflow:hidden;background:var(--ink)}
.frame img{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;object-position:50% 35%;filter:blur(14px) saturate(.9);transform:scale(1.04)}
.frame .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(96px,13vw,180px);color:rgba(245,242,234,.92);letter-spacing:.02em}
.frame .tag{position:absolute;left:18px;top:18px;display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:0 14px;border-radius:999px;border:1px solid rgba(245,242,234,.8);color:var(--paper);font-size:11px;letter-spacing:.22em}
.frame .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#C7563E}
.frame .meta{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;color:rgba(245,242,234,.85);font-size:11px;letter-spacing:.2em}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px;border-top:1px solid #DAD5C8;font-size:11px;letter-spacing:.2em;color:var(--muted)}
@media (max-width:820px){
  main .wrap{grid-template-columns:1fr;gap:36px;padding-block:16px 48px}
  .frame{aspect-ratio:5/4;order:-1}
  .btns .btn{flex:1 1 220px}
  .lm{width:36px;height:36px}.lw b{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="/" aria-label="Фотограф Валерія — на головну">
    <svg class="lm" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="118 10.8" transform="rotate(-30 22 22)"/><circle cx="36.5" cy="7.5" r="1.7" fill="currentColor"/><text x="22" y="29.6" text-anchor="middle" font-family="Oswald, sans-serif" font-weight="600" font-size="21" fill="currentColor">В</text></svg>
    <span class="lw"><b>ВАЛЕРІЯ</b><i>ФОТОГРАФ</i></span>
  </a>
</div></header>

<main><div class="wrap">
  <div>
    <div class="k">ПОМИЛКА 404</div>
    <h1>Цей кадр не&nbsp;в&nbsp;фокусі</h1>
    <p>Такої сторінки немає: можливо, посилання застаріло або в адресі помилка. Зате є багато інших історій — на головній і в портфоліо.</p>
    <div class="btns">
      <a class="btn" href="/">НА ГОЛОВНУ →</a>
      <a class="btn ghost" href="/portfolio/">ПОРТФОЛІО</a>
    </div>
  </div>
  <div class="frame" aria-hidden="true">
    <img src="/og.jpg" alt="">
    <div class="tag">REC</div>
    <div class="num">404</div>
    <div class="meta"><span>F/1.8</span><span>1/200</span><span>ISO 404</span></div>
  </div>
</div></main>

<footer><div class="wrap">
  <span>© ВАЛЕРІЯ · ФОТОГРАФ</span>
  <span>ЧОРНОМОРСЬК / ОДЕСА</span>
</div></footer>
</body>
</html>
