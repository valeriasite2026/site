# Налаштування адмін-панелі (Decap CMS). Документація: https://decapcms.org/docs/
backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Нова зйомка: {{slug}}"
    update: "Зміни: {{collection}} / {{slug}}"
    delete: "Видалено: {{collection}} / {{slug}}"
    uploadMedia: "Фото: {{path}}"
    deleteMedia: "Видалено фото: {{path}}"

# для перевірки на своєму комп'ютері: npx decap-server
local_backend: true

locale: uk
site_url: https://valeriaphoto.netlify.app
display_url: https://valeriaphoto.netlify.app
logo_url: /favicon.svg
media_folder: media
public_folder: /media

collections:
  - name: shoots
    label: "Зйомки"
    label_singular: "зйомку"
    description: "Історії в портфоліо. У кожній зйомці 4–6 фото. Нова зйомка автоматично стає першою у своїй категорії."
    folder: content/shoots
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} · {{location}}"
    sortable_fields: ["title"]
    view_groups:
      - { label: "Категорія", field: category }
    fields:
      - { label: "Назва", name: title, widget: string }
      - label: "Категорія"
        name: category
        widget: select
        options:
          - { label: "Персональні", value: p }
          - { label: "Сімейні", value: f }
          - { label: "Івенти", value: e }
      - { label: "Локація", name: location, widget: string, hint: "Наприклад: Чорноморськ, студія" }
      - { label: "Опис", name: description, widget: text }
      - label: "Фото"
        name: photos
        widget: list
        min: 4
        max: 6
        collapsed: false
        summary: "{{fields.image}}"
        hint: "Від 4 до 6 фото. Порядок можна змінювати перетягуванням. Найкраще — фото до 5 МБ (наприклад, експорт 2000 px по довгій стороні)."
        fields:
          - { label: "Фото", name: image, widget: image, choose_url: false }
          - &pos
            label: "Що показувати, якщо фото обрізається"
            name: pos
            widget: select
            default: "50% 50%"
            required: false
            hint: "Фото в колажі обрізається під розмір клітинки. Оберіть, яку частину кадру залишити."
            options:
                - { label: "Верх фото", value: "50% 15%" }
                - { label: "Ближче до верху (обличчя)", value: "50% 30%" }
                - { label: "Центр", value: "50% 50%" }
                - { label: "Ближче до низу", value: "50% 70%" }
                - { label: "Низ фото", value: "50% 85%" }
                - { label: "≈ ближче до верху, лівіше (45% 28%)", value: "45% 28%" }
                - { label: "≈ ближче до верху (50% 28%)", value: "50% 28%" }
                - { label: "≈ ближче до верху, правіше (55% 30%)", value: "55% 30%" }
                - { label: "≈ ближче до верху (50% 32%)", value: "50% 32%" }
                - { label: "≈ трохи вище центру, лівіше (45% 35%)", value: "45% 35%" }
                - { label: "≈ трохи вище центру (50% 35%)", value: "50% 35%" }
                - { label: "≈ трохи вище центру, правіше (60% 35%)", value: "60% 35%" }
                - { label: "≈ трохи вище центру (50% 38%)", value: "50% 38%" }
                - { label: "≈ трохи вище центру, лівіше (42% 40%)", value: "42% 40%" }
                - { label: "≈ трохи вище центру (50% 40%)", value: "50% 40%" }
                - { label: "≈ трохи вище центру, правіше (55% 40%)", value: "55% 40%" }
                - { label: "≈ центр (50% 45%)", value: "50% 45%" }
                - { label: "≈ центр, правіше (60% 45%)", value: "60% 45%" }
                - { label: "≈ центр (50% 55%)", value: "50% 55%" }
      - label: "Показувати на головній"
        name: featured
        widget: boolean
        default: false
        hint: "На головній — одна зйомка з кожної категорії. Нові зйомки потрапляють лише на сторінку портфоліо, поки тут не ввімкнено. Якщо ввімкнено в кількох — на головній найновіша з них."
      - label: "Фото для головної"
        name: preview
        widget: list
        required: false
        max: 4
        field: { label: "Фото", name: image, widget: image, choose_url: false }
        hint: "Рівно 4 фото з цієї зйомки для маленького колажу на головній. Якщо пусто — беруться перші фото."
      - { label: "Сховати з сайту", name: hidden, widget: boolean, default: false, hint: "Зйомка залишиться тут, але не буде видна на сайті." }

  - name: prices
    label: "Ціни"
    files:
      - name: prices
        label: "Ціни та пакети"
        file: content/site/prices.json
        fields:
          - label: "Персональна зйомка"
            name: ind
            widget: object
            collapsed: false
            fields:
              - { label: "Назва вкладки", name: tab, widget: string }
              - { label: "Короткий опис", name: note, widget: string }
              - label: "Пакети"
                name: tariffs
                widget: list
                summary: "{{fields.d}} — {{fields.p}} грн"
                fields:
                  - { label: "Тривалість", name: d, widget: string, hint: "Наприклад: 1,5 години" }
                  - { label: "Ціна, грн", name: p, widget: string, hint: "Лише число, без «грн»" }
                  - { label: "Що входить", name: items, widget: list, field: { label: "Пункт", name: item, widget: string } }
          - label: "Сімейна зйомка"
            name: fam
            widget: object
            collapsed: true
            fields:
              - { label: "Назва вкладки", name: tab, widget: string }
              - { label: "Короткий опис", name: note, widget: string }
              - label: "Пакети"
                name: tariffs
                widget: list
                summary: "{{fields.d}} — {{fields.p}} грн"
                fields:
                  - { label: "Тривалість", name: d, widget: string, hint: "Наприклад: 1,5 години" }
                  - { label: "Ціна, грн", name: p, widget: string, hint: "Лише число, без «грн»" }
                  - { label: "Що входить", name: items, widget: list, field: { label: "Пункт", name: item, widget: string } }
          - label: "Зйомка подій"
            name: evt
            widget: object
            collapsed: true
            fields:
              - { label: "Назва вкладки", name: tab, widget: string }
              - { label: "Короткий опис", name: note, widget: string }
              - label: "Пакети"
                name: tariffs
                widget: list
                summary: "{{fields.d}} — {{fields.p}} грн"
                fields:
                  - { label: "Тривалість", name: d, widget: string, hint: "Наприклад: 1,5 години" }
                  - { label: "Ціна, грн", name: p, widget: string, hint: "Лише число, без «грн»" }
                  - { label: "Що входить", name: items, widget: list, field: { label: "Пункт", name: item, widget: string } }
          - label: "Передоплата"
            name: prepay
            widget: object
            fields:
              - { label: "Заголовок (жирним)", name: title, widget: string, required: false, hint: "Якщо пусто — блок не показується" }
              - { label: "Текст", name: text, widget: text, required: false }


  - name: site
    label: "Сайт"
    editor: { preview: false }
    files:
      - name: about
        label: "Про мене"
        file: content/site/about.json
        fields:
          - label: "Велике фото"
            name: photo
            widget: object
            fields:
              - { label: "Фото", name: image, widget: image, choose_url: false }
              - { label: "Що на фото (для Google і незрячих)", name: alt, widget: string }
              - *pos
          - label: "Мале фото"
            name: photo2
            widget: object
            fields:
              - { label: "Фото", name: image, widget: image, choose_url: false }
              - { label: "Що на фото (для Google і незрячих)", name: alt, widget: string }
              - *pos
          - label: "Абзаци тексту"
            name: paragraphs
            widget: list
            field: { label: "Абзац", name: text, widget: text }

      - name: home
        label: "Головна — фото"
        file: content/site/home.json
        fields:
          - label: "Велике фото"
            name: hero
            widget: object
            fields:
              - { label: "Фото", name: image, widget: image, choose_url: false }
              - { label: "Що на фото (для Google і незрячих)", name: alt, widget: string }
              - *pos
          - label: "Мале фото"
            name: small
            widget: object
            fields:
              - { label: "Фото", name: image, widget: image, choose_url: false }
              - { label: "Що на фото (для Google і незрячих)", name: alt, widget: string }
              - *pos

      - name: contacts
        label: "Контакти"
        file: content/site/contacts.json
        fields:
          - { label: "Телефон", name: phone, widget: string, hint: "Як показувати на сайті, напр. +380 93 779 62 96" }
          - { label: "Telegram (нікнейм без @)", name: telegram, widget: string }
          - { label: "Instagram (нікнейм без @)", name: instagram, widget: string }
          - { label: "Threads (нікнейм без @)", name: threads, widget: string }
